name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # The forge's runners: v4 actions as in every other repo there, Node 24 as the apps that
      # install this package run, and no setup-node cache (the runners keep ~/.npm on the host).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build library
        run: npm run build
      - name: Verify package contents (types, css, exports)
        run: npm run verify:package
      - name: Build demo application
        run: npm run build:app
