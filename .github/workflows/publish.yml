name: Publish to npm

# Publishes the package to the public npm registry (https://www.npmjs.com/package/teamsync-pdf-viewer).
#
# Two triggers:
#   - pushing a tag `vX.Y.Z` (the tag's commit must have package.json version X.Y.Z)
#   - manual "Run workflow" with a `ref` (branch / tag / SHA) to publish from — this also covers
#     commits that predate this workflow file, e.g. the 1.1.0 merge commit.
#
# Requires the repository secret NPM_TOKEN (an npm "Automation" token with publish rights).
# The full verification chain runs first; nothing is published if any step fails.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or SHA) to publish from'
        required: true
        default: 'main'
      dry_run:
        description: 'Run everything but skip the actual npm publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify (lint, typecheck, tests, build, package guards)
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run verify:package
      - name: Check version against tag / registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $VERSION"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "::error::tag v$TAG does not match package.json version $VERSION"; exit 1
            fi
          fi
          if npm view "teamsync-pdf-viewer@$VERSION" version >/dev/null 2>&1; then
            echo "::error::teamsync-pdf-viewer@$VERSION is already on the registry"; exit 1
          fi
      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
